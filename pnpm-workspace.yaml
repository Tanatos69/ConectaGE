packages:
  - 'apps/*'

# pnpm 11 build-script approvals (true = run native build, false = skip).
# unrs-resolver ships a JS fallback, so skipping its build is safe and keeps
# `pnpm install` exiting 0.
allowBuilds:
  sharp: true
  '@tailwindcss/oxide': true
  esbuild: true
  '@swc/core': true
  unrs-resolver: false
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260721.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260721.1'
  - '@cloudflare/workerd-linux-64@1.20260721.1'
  - '@cloudflare/workerd-linux-arm64@1.20260721.1'
  - '@cloudflare/workerd-windows-64@1.20260721.1'
  - '@opennextjs/aws@4.1.0'
  - '@opennextjs/cloudflare@1.20.2'
  - miniflare@4.20260721.0
  - workerd@1.20260721.1
  - wrangler@4.113.0
